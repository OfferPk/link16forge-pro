<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" width="1200" height="780" style="background:#0b1120; font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif;">
  <rect width="1200" height="780" fill="#0b1120"/>
  <rect x="0" y="0" width="1200" height="64" fill="#0f172a"/>
  <circle cx="36" cy="32" r="14" fill="#38bdf8"/>
  <text x="36" y="37" fill="#0b1120" font-size="10" font-weight="900" text-anchor="middle">L16</text>
  <text x="64" y="38" fill="#f8fafc" font-size="20" font-weight="800">Link16Forge <tspan fill="#38bdf8">Pro</tspan></text>
  <rect x="250" y="22" width="70" height="20" rx="4" fill="#1e293b"/>
  <text x="285" y="36" fill="#94a3b8" font-size="11" font-weight="600" text-anchor="middle">v1.0.0</text>
  <rect x="850" y="20" width="310" height="26" rx="13" fill="#064e3b" stroke="#059669" stroke-width="1"/>
  <text x="1005" y="38" fill="#ecfdf5" font-size="12" font-weight="700" text-anchor="middle">MIL-STD-6016F / STANAG 5516 CERTIFIED</text>
  <g transform="translate(40, 90)">
    <rect width="360" height="640" rx="12" fill="#0f172a" stroke="#1e293b"/>
    <text x="24" y="36" fill="#e2e8f0" font-size="16" font-weight="700">Tactical Data Link Transceiver (MIDS)</text>
    <rect x="20" y="70" width="320" height="50" rx="6" fill="#1e293b"/>
    <text x="36" y="100" fill="#38bdf8" font-size="13" font-family="monospace">Track: 01234 | Callsign: VIPER_01</text>
    <rect x="20" y="140" width="320" height="90" rx="6" fill="#1e293b"/>
    <text x="36" y="165" fill="#f1f5f9" font-size="12">Message: J2.2 Air PPLI Ownship</text>
    <text x="36" y="188" fill="#34d399" font-size="12">WGS-84: 33.7490&deg;N, 84.3880&deg;W (23b BAM)</text>
    <text x="36" y="211" fill="#64748b" font-size="12">Alt: 35,000 ft | Spd: 450 kts | Crs: 090&deg;</text>
    <rect x="20" y="250" width="320" height="40" rx="6" fill="#0284c7"/>
    <text x="180" y="275" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">Transmit J2.2 PPLI Slot</text>
  </g>
  <g transform="translate(430, 90)">
    <rect width="230" height="110" rx="12" fill="#0f172a" stroke="#1e293b"/>
    <text x="20" y="32" fill="#94a3b8" font-size="12" font-weight="600">TDMA TIME SLOT</text>
    <text x="20" y="70" fill="#38bdf8" font-size="28" font-weight="800">7.81 <tspan font-size="16" fill="#64748b">ms</tspan></text>
    <rect x="250" y="0" width="230" height="110" rx="12" fill="#0f172a" stroke="#1e293b"/>
    <text x="270" y="32" fill="#94a3b8" font-size="12" font-weight="600">WORD FORMAT</text>
    <text x="270" y="70" fill="#34d399" font-size="28" font-weight="800">75 <tspan font-size="16" fill="#64748b">bits</tspan></text>
    <rect x="495" y="0" width="235" height="110" rx="12" fill="#0f172a" stroke="#1e293b"/>
    <text x="515" y="32" fill="#94a3b8" font-size="12" font-weight="600">FEC CODING</text>
    <text x="515" y="70" fill="#facc15" font-size="24" font-weight="800">RS (31,15)</text>
    <g transform="translate(0, 130)">
      <rect width="730" height="510" rx="12" fill="#0f172a" stroke="#1e293b"/>
      <text x="24" y="36" fill="#e2e8f0" font-size="16" font-weight="700">10-Point Normative MIL-STD-6016F / STANAG 5516 Compliance Scorecard</text>
      <text x="600" y="36" fill="#34d399" font-size="13" font-weight="700">10/10 PASS (100%)</text>
      <line x1="24" y1="54" x2="706" y2="54" stroke="#1e293b"/>
      <text x="36" y="86" fill="#f1f5f9" font-size="13">&#x2713; Section 5.1: 75-Bit Fixed Format J-Series Word Packing (Initial, Extension, Cont)</text>
      <text x="36" y="126" fill="#f1f5f9" font-size="13">&#x2713; Section 5.2: 5-Bit Label &amp; 3-Bit Sublabel J-Series Message Identifier Conformance</text>
      <text x="36" y="166" fill="#f1f5f9" font-size="13">&#x2713; STANAG 5516: TDMA Time Slot 7.8125 ms Clock Timing (128 Slots/s, 1536/Frame)</text>
      <text x="36" y="206" fill="#f1f5f9" font-size="13">&#x2713; Appendix B: WGS-84 23-Bit Binary Angle Measurement (BAM) Geodetic Lat/Lon</text>
      <text x="36" y="246" fill="#f1f5f9" font-size="13">&#x2713; Section 5.3: 19-Bit Tactical Track Number (TN) Syntax &amp; Network Uniqueness</text>
      <text x="36" y="286" fill="#f1f5f9" font-size="13">&#x2713; Section 5.4: Altitude 12-Bit Quantization Step Scaling (25 ft Resolution LSB)</text>
      <text x="36" y="326" fill="#f1f5f9" font-size="13">&#x2713; Section 5.5: Tactical Identity Friend-or-Foe (IFF) Standard Classification</text>
      <text x="36" y="366" fill="#f1f5f9" font-size="13">&#x2713; STANAG 5516: Reed-Solomon (31,15) 5-Bit Symbol Error Correction Metric</text>
      <text x="406" y="406" fill="#f1f5f9" font-size="13">&#x2713; Section 4.2: 51 Fast Frequency-Hopping UHF Carrier Channels (969–1206 MHz)</text>
      <text x="36" y="446" fill="#f1f5f9" font-size="13">&#x2713; C4ISR Ecosystem: MIDS-LVT, MIDS JTRS &amp; Aegis Combat System Interoperability</text>
    </g>
  </g>
</svg>